<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Birthday Gift for Haripriya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti"></canvas>

<main>
  <!-- Screen 1: the gift box -->
  <section id="cover" class="screen">
    <div class="gift" id="giftBox" role="button" tabindex="0" aria-label="Tap to unwrap your gift">🎁</div>
    <h1 id="coverTitle"></h1>
    <p class="hint">Tap the gift to unwrap</p>
  </section>

  <!-- Screen 2: the voucher book -->
  <section id="voucher" class="screen hidden">
    <div class="card">
      <p class="eyebrow">🎟️ Birthday Voucher Book</p>
      <h2 id="vName"></h2>
      <div class="photos hidden" id="vPhotos"></div>
      <p class="msg" id="vMessage"></p>

      <div class="meta">
        <div><span>Book code</span><strong id="vCode"></strong></div>
        <div><span>Valid until</span><strong id="vExpiry"></strong></div>
        <div><span>Max value</span><strong id="vMax"></strong></div>
      </div>

      <p class="step">Tap a voucher to open it 👇</p>
      <div class="vouchers" id="vouchers"></div>

      <details class="terms">
        <summary>Terms &amp; conditions</summary>
        <ul id="terms"></ul>
      </details>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
