<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Birthday Gift for Haripriya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti"></canvas>

<main>
  <!-- Screen 1: the gift box -->
  <section id="cover" class="screen">
    <div class="gift" id="giftBox" role="button" tabindex="0" aria-label="Tap to unwrap your gift">🎁</div>
    <h1 id="coverTitle"></h1>
    <p class="hint">Tap the gift to unwrap</p>
  </section>

  <!-- Screen 2: the voucher -->
  <section id="voucher" class="screen hidden">
    <div class="card">
      <p class="eyebrow">🎂 Birthday Gift Voucher</p>
      <h2 id="vName"></h2>
      <img id="vPhoto" class="photo hidden" alt="Haripriya">
      <p class="msg" id="vMessage"></p>

      <p class="step">Pick your gift 👇</p>
      <div class="gifts" id="gifts"></div>

      <div class="meta">
        <div><span>Voucher code</span><strong id="vCode"></strong></div>
        <div><span>Valid until</span><strong id="vExpiry"></strong></div>
      </div>

      <button class="redeem" id="redeemBtn" disabled>Redeem my gift 🎁</button>
      <p class="status" id="status"></p>

      <details class="terms">
        <summary>Terms &amp; conditions</summary>
        <ul id="terms"></ul>
      </details>

      <div class="stamp hidden" id="stamp">REDEEMED ✓</div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
